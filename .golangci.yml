version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - asciicheck
    - bodyclose
    - cyclop
    - dupl
    - durationcheck
    - err113
    - errorlint
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godot
    - gosec
    - lll
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nlreturn
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - sqlclosecheck
    - testpackage
    - thelper
    - unconvert
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      tab-width: 4
    revive:
      confidence: 0.8
      severity: error
      rules:
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: flag-parameter
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: nested-structs
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-parameter
        - name: unused-receiver
        - name: useless-break
        - name: var-declaration
        - name: waitgroup-by-value
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - cyclop
          - dupl
          - errcheck
          - gochecknoglobals
          - gocognit
          - lll
        path: _test\.go
      - linters:
          - revive
        path: _test\.go
        text: seems to be a control flag, avoid control coupling
      - linters:
          - errcheck
        source: "^\t+defer "
      - linters:
          - err113
        text: do not define dynamic errors, use wrapped static errors instead
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  exclusions:
    generated: lax
