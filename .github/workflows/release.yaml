name: Release

on:
    push:
        tags:
            - v*

permissions:
    contents: read

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   uses: actions/setup-go@v7
                with:
                    go-version: stable
            -   name: Run tests
                run: make test
            -   name: GoReleaser
                uses: goreleaser/goreleaser-action@v7
                with:
                    version: '~> v2'
                    args: release --clean
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
